# brew tap-new uses this file to generate a bottle publish workflow for the new tap
name: brew pr-pull

on:
  workflow_run:
    workflows:
      - brew test-bot
    types:
      - completed
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Resolve and authorize release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
          DISPATCH_PULL_REQUEST: ${{ inputs.pull_request }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]
          then
            pull_request="$RUN_PULL_REQUEST"
            head_sha="$RUN_HEAD_SHA"
          else
            pull_request="$DISPATCH_PULL_REQUEST"
            head_sha="$DISPATCH_HEAD_SHA"
          fi

          if [[ -z "$pull_request" ]]
          then
            echo "A pull request number is required"
            exit 1
          fi

          pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull_request")"
          actual_head_sha="$(jq -r '.head.sha' <<<"$pull")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pull")"
          state="$(jq -r '.state' <<<"$pull")"
          draft="$(jq -r '.draft' <<<"$pull")"

          if [[ -z "$head_sha" ]]
          then
            head_sha="$actual_head_sha"
          fi
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]
          then
            echo "Refusing to publish bottles from fork $head_repo"
            exit 1
          fi
          if [[ "$state" != "open" || "$draft" != "false" ]]
          then
            echo "Pull request must be open and ready for review"
            exit 1
          fi
          if [[ "$head_sha" != "$actual_head_sha" ]]
          then
            echo "Expected head $head_sha but pull request is at $actual_head_sha"
            exit 1
          fi

          echo "head_sha=$head_sha" >>"$GITHUB_OUTPUT"
          echo "pull_request=$pull_request" >>"$GITHUB_OUTPUT"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1

      - name: Verify required bottle checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.release.outputs.head_sha }}
        run: |
          checks="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
            -f per_page=100)"
          required=(
            "test-bot (arm64_sonoma)"
            "test-bot (arm64_sequoia)"
            "test-bot (arm64_tahoe)"
            "test-bot (x86_64_linux)"
          )

          for name in "${required[@]}"
          do
            conclusion="$(jq -r --arg name "$name" '
              [.check_runs[] | select(.name == $name) | .conclusion]
              | if index("success") then "success"
                elif length == 0 then "missing"
                else join(",")
                end
              ' <<<"$checks")"
            if [[ "$conclusion" != "success" ]]
            then
              echo "$name is $conclusion; refusing to publish incomplete bottle coverage"
              exit 1
            fi
          done

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ steps.release.outputs.head_sha }}
          PULL_REQUEST: ${{ steps.release.outputs.pull_request }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"
          else
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Push commits
        uses: Homebrew/actions/git-try-push@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          branch: main
